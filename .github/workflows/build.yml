name: Build Linux VPN Agent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Compile main.cpp
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pthread main.cpp -o vpnagent -lcurl

      - name: Smoke test (daemon not running should exit 2)
        run: |
          set +e
          ./vpnagent --check
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnagent-linux
          path: vpnagent
